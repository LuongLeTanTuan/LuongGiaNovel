<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&amp;subset=vietnamese&amp;display=swap');
      .logo-title {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 800;
      }
      .logo-sub {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        letter-spacing: 12px;
      }
    </style>

    <!-- Gold Foil Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0" />
      <stop offset="25%" stop-color="#e8be7d" />
      <stop offset="50%" stop-color="#c59247" />
      <stop offset="75%" stop-color="#f5dfa8" />
      <stop offset="100%" stop-color="#a47125" />
    </linearGradient>

    <linearGradient id="goldGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd584" />
      <stop offset="50%" stop-color="#fff5db" />
      <stop offset="100%" stop-color="#d99f43" />
    </linearGradient>

    <!-- Deep Luxury Glow Filter -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crown Icon at the Top Center -->
  <g transform="translate(325, 28) scale(0.75)" filter="url(#luxuryGlow)">
    <path d="M-22,-4 L-12,14 L0,2 L12,14 L22,-4 L15,22 L-15,22 Z" fill="url(#goldGradient)" />
    <!-- Jewels on crown tips -->
    <circle cx="-22" cy="-5" r="2.5" fill="#fff6d6" />
    <circle cx="0" cy="1" r="3" fill="#ffffff" />
    <circle cx="22" cy="-5" r="2.5" fill="#fff6d6" />
  </g>

  <!-- Decorative flourishes above/around LƯƠNG GIA -->
  <path d="M 60,65 Q 120,38 200,60" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.8" />
  <circle cx="60" cy="65" r="2.5" fill="#ffd584" />
  
  <path d="M 590,65 Q 530,38 450,60" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.8" />
  <circle cx="590" cy="65" r="2.5" fill="#ffd584" />

  <!-- Main Word: LƯƠNG GIA -->
  <text x="325" y="98" 
        text-anchor="middle" 
        class="logo-title"
        font-size="62" 
        letter-spacing="3" 
        fill="url(#goldGradient)"
        filter="url(#softGlow)">
    LƯƠNG GIA
  </text>

  <!-- Subtitle: NOVEL with Soundwave / Audio-style Accent Wings -->
  <!-- Left Soundwaves -->
  <g transform="translate(205, 142)" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round">
    <line x1="-30" y1="0" x2="-30" y2="0" />
    <line x1="-24" y1="-4" x2="-24" y2="4" />
    <line x1="-18" y1="-8" x2="-18" y2="8" />
    <line x1="-12" y1="-14" x2="-12" y2="14" />
    <line x1="-6" y1="-8" x2="-6" y2="8" />
    <line x1="0" y1="-4" x2="0" y2="4" />
  </g>

  <!-- Novel text in refined Serif / Sans luxury spacing -->
  <text x="325" y="148" 
        text-anchor="middle" 
        class="logo-sub"
        font-size="26" 
        fill="url(#goldGradientLight)">
    NOVEL
  </text>

  <!-- Right Soundwaves -->
  <g transform="translate(445, 142)" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-4" x2="0" y2="4" />
    <line x1="6" y1="-8" x2="6" y2="8" />
    <line x1="12" y1="-14" x2="12" y2="14" />
    <line x1="18" y1="-8" x2="18" y2="8" />
    <line x1="24" y1="-4" x2="24" y2="4" />
    <line x1="30" y1="0" x2="30" y2="0" />
  </g>

  <!-- Elegant Bottom Crest or Flourish Center -->
  <path d="M 270,165 Q 325,178 380,165" fill="none" stroke="url(#goldGradient)" stroke-width="1.4" opacity="0.75" />
  <polygon points="325,170 322,175 328,175" fill="url(#goldGradient)" />
</svg>
